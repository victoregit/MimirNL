name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline regression fixtures require historical pinned Git sources.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run schemas:check
      - run: npm run package:smoke
      - run: npm run benchmark
